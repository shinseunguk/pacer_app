# 앱 아이콘 생성 설정 — 원본은 tool/generate_brand_assets.py 로 만든다.
# 재생성: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # 안드로이드 적응형 아이콘 (배경은 브랜드 퍼플)
  adaptive_icon_background: '#7B6CF0'
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
